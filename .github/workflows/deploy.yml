name: Deploy Git Action
# 언제부터 배포를 수행(시작)할지 => main에서 push를 했을 시 배포
on: 
  push:
    branches:
      - main
# 작업지시 => runs-on에서 작업이 시작된다
jobs:
  deploy:
    runs-on: self-hosted # 본인의 현재 우분투에 배포하겠다
# 어떤 순서로 배포 진행을 할지
    steps:
    # 소스코드를 다운로드 받을 때 사용 => clone이랑 같은 느낌
      - uses: actions/checkout@v4 
      # jdk 21버전인지 확인
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
     # gradlew 권한 부여
      - run: chmod +x gradlew 
      # build
      - run: ./gradlew clean build -x test
      # 실행 => jar 파일 생성 => java -jar app.jar
      - run: |
          PID=$(lsof -t -i:8080)
          [-n "$PID"] && kill -15 $PID || true
      - run: nohup java -jar buid/libs/*.0.0.1-SNAPSHOT.jar > app.log2>&1 &    






  







      
